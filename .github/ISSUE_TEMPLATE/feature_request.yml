name: Feature request
description: Suggest something QuestBridge should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: hardware
    attributes:
      label: Headset and computer
      placeholder: Quest 3 on a MacBook Pro (M2)
